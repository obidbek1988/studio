name: Studio 24-7 Cloud Service

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: studio-cloud-group
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  cloud-runner:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:
      - name: Repositoriyani yuklash
        uses: actions/checkout@v4

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        shell: cmd
        run: |
          python -m pip install --quiet requests openpyxl psutil pillow playwright openai-whisper
          python -m playwright install chromium

