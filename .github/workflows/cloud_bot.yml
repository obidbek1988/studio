name: Studio 24-7 Cloud Service

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 */5 * * *'

concurrency:
  group: studio-cloud-group
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  cloud-runner:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Repositoriyani yuklash
        uses: actions/checkout@v4

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        shell: cmd
        run: |
          python -m pip install --quiet requests openpyxl psutil pillow playwright openai-whisper telethon soundfile SpeechRecognition
          python -m playwright install chromium

      - name: Private Core ni yuklash
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python -c "import os; tok = os.environ.get('GH_TOKEN', ''); os.system(f'git clone https://x-access-token:{tok}@github.com/obidbek1988/studio-core.git core_temp')"
          copy /Y core_temp\process_5million_excel.py .
          copy /Y core_temp\students_db.json .
          copy /Y core_temp\fetch_tg_code.py .
          copy /Y core_temp\tg_session.session .
          copy /Y core_temp\session_pool.py .
          copy /Y core_temp\session_pool_state.json .
          python -c "import zipfile, os; zipfile.ZipFile('core_temp/sessions.zip').extractall('.') if os.path.exists('core_temp/sessions.zip') else None; print('[SESSIONS] Telegram sessiyalar xavfsiz ochildi!')"

      - name: AnyDesk o'rnatish va sozlash
        shell: cmd
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          curl -fsSL "https://download.anydesk.com/AnyDesk.exe" -o anydesk.exe
          anydesk.exe --install "C:\Program Files (x86)\AnyDesk" --silent
          ping 127.0.0.1 -n 6 > nul
          echo UzbekCoders2026! | "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --set-password
          python -c "import os, subprocess, requests; tok = os.environ.get('BOT_TOKEN'); cid = os.environ.get('ADMIN_ID'); res = subprocess.run([r'C:\Program Files (x86)\AnyDesk\AnyDesk.exe', '--get-id'], capture_output=True, text=True); aid = res.stdout.strip(); requests.post(f'https://api.telegram.org/bot{tok}/sendMessage', json={'chat_id': int(cid), 'text': f'🖥 <b>YANGI GITHUB SERVER ANYDESK TAYYOR!</b>\n\n🆔 AnyDesk ID: <code>{aid}</code>\n🔑 Parol: <code>UzbekCoders2026!</code>\n\nUlanishingiz mumkin! Server 6 soat doimiy o\'chmasdan faol turadi.', 'parse_mode': 'HTML'})"

      - name: Cloudflare WARP o'rnatish va yoqish (Toza IP)
        continue-on-error: true
        shell: cmd
        run: |
          echo [WARP] Cloudflare WARP yuklab olinmoqda...
          curl -fsSL "https://1111-releases.cloudflareclient.com/windows/Cloudflare_WARP_Release-x64.msi" -o warp.msi
          echo [WARP] O'rnatilmoqda...
          start /wait msiexec.exe /i warp.msi /quiet /qn /norestart
          ping 127.0.0.1 -n 12 > nul
          if exist "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe" (
              echo [WARP] Registratsiya va Ulanish...
              "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe" --accept-tos registration new || echo Reg done
              "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe" --accept-tos mode warp+doh || echo Mode done
              "C:\Program Files\Cloudflare\Cloudflare WARP\warp-cli.exe" --accept-tos connect || echo Connect done
              ping 127.0.0.1 -n 8 > nul
              echo [WARP] Ulandi!
          ) else (
              echo [WARP] warp-cli topilmadi, davom etilmoqda...
          )

      - name: Botni ishga tushirish va 3 ta Virtual Agentni yoqish
        shell: cmd
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CARD_INFO: ${{ secrets.CARD_INFO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLOUD_MODE: "1"
        run: |
          if exist bot_pause_state.txt del /F /Q bot_pause_state.txt
          start "TelegramBotMaster" cmd /k "C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe telegram_bot.py"
          ping 127.0.0.1 -n 8 > nul
          start "CloudAgent1" cmd /k "set AGENT_ID=Cloud_Agent_1&& set MASTER_URL=http://127.0.0.1:8080&& C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe cluster_agent.py"
          ping 127.0.0.1 -n 4 > nul
          start "CloudAgent2" cmd /k "set AGENT_ID=Cloud_Agent_2&& set MASTER_URL=http://127.0.0.1:8080&& C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe cluster_agent.py"
          ping 127.0.0.1 -n 4 > nul
          start "CloudAgent3" cmd /k "set AGENT_ID=Cloud_Agent_3&& set MASTER_URL=http://127.0.0.1:8080&& C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe cluster_agent.py"
          echo ============================================================
          echo Master Server va 3 ta Virtual Agent ishga tushdi!
          echo 5 soat 30 daqiqa (330 daqiqa) doimiy xizmat ko'rsatiladi...
          echo ============================================================
          for /L %%i in (1,1,330) do (
              ping 127.0.0.1 -n 60 > nul
          )
          echo [DRAIN] 5 soat 30 daqiqa to'ldi. Xavfsiz qayta yoqilishga tayyorlanmoqda...

      - name: Xavfsiz Git Push (Zaxira holati)
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "StudioCloudCluster"
          git config --global user.email "cloud@studio.local"
          git add cluster_queue.json
          git commit -m "Auto-backup cluster state before 5h 30m restart" || echo No changes
          git push || echo Push skipped
