name: 5 Million Prompter 24-7 Cloud Master Bot

on:
  workflow_dispatch:
  schedule:
    # Har 5 soatda avtomatik tekshirib yangilab turish
    - cron: '0 */5 * * *'

concurrency:
  group: 5million-cloud-bot-group
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  cloud-bot-runner:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:
      - name: Repositoriyani yuklash
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 3.11 ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        shell: cmd
        run: |
          python -m pip install --quiet requests openpyxl psutil pillow playwright openai-whisper
          python -m playwright install chromium

      - name: Bulutda 5 Million Botni Ishga Tushirish (Kompyutersiz 24/7)
        shell: cmd
        env:
          BOT_TOKEN: "9215921692:AAFscb1vWXl9LMe-IHLo7VZrkLeKL1xJkhQ"
          ADMIN_ID: "6580113791"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CARD_INFO: "5614 6812 1100 2260 (QOBILOV OBIDJON)"
          CLOUD_MODE: "1"
        run: |
          python telegram_bot.py
