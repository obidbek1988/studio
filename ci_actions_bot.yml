name: 5 Million Prompter Bot CI & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    steps:
    - name: Repositoriyani yuklash
      uses: actions/checkout@v4

    - name: Python 3.11 ni o'rnatish
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Bot fayllari sintaksisini tekshirish
      run: |
        python -m py_compile telegram_bot.py
        python -m py_compile process_5million_excel.py

  run_cloud_bot:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
    - name: Repositoriyani yuklash
      uses: actions/checkout@v4

    - name: Python 3.11 ni o'rnatish
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Kutubxonalar va Playwright o'rnatish
      run: |
        pip install requests openpyxl psutil pillow playwright openai-whisper
        playwright install chromium --with-deps

    - name: Botni ishga tushirish (Cloud Runner)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        ADMIN_ID: ${{ secrets.ADMIN_ID }}
      run: |
        python telegram_bot.py
